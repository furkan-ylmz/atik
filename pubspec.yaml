name: atik
description: "Yapay zeka destekli akıllı atık ve geri dönüşüm nesnesi tespit uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  tflite_flutter: ^0.11.0
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  image: ^4.1.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
